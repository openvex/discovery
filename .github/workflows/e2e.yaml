---
name: Run e2e Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions: {}

jobs:
  resolve-versions:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      go-versions: ${{ steps.matrix.outputs.go-versions }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Go versions
        id: go-versions
        uses: carabiner-dev/actions/go/versions@d41fe10fe88deaf493ce026007da73738b9f570c # v1.3.0

      - name: Build version matrix
        id: matrix
        env:
          GO_VERSION_STABLE: ${{ steps.go-versions.outputs.GO_VERSION_STABLE }}
          GO_VERSION_PREVIOUS: ${{ steps.go-versions.outputs.GO_VERSION_PREVIOUS }}
        run: |
          echo "go-versions=[\"${GO_VERSION_STABLE}\",\"${GO_VERSION_PREVIOUS}\"]" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (go ${{ matrix.go-version }})
    needs: resolve-versions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.resolve-versions.outputs.go-versions) }}

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Check out code onto GOPATH
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        name: Setup crane 🪿 ♥️ 🏗️

      - name: Install Cosign 🪿 ♥️ ·∫·
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Push Test Images
        shell: bash
        run: |
          ./scripts/e2e.sh

      - name: Run Tests
        run: |
          go test -v ./...

  # Gate job with a stable name for branch protection. Fails if any
  # matrix leg failed or was cancelled.
  tests:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Check e2e matrix result
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "e2e matrix result: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            exit 1
          fi
